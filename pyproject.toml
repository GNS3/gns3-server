[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gns3-server"
description = "GNS3 graphical interface for the GNS3 server."
license-files = ["LICENSE"]
authors = [
  { name = "Jeremy Grossmann", email = "developers@gns3.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Environment :: Console",
        "Framework :: FastAPI",
        "Intended Audience :: Information Technology",
        "Topic :: System :: Networking",
        "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
        "Natural Language :: English",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: Implementation :: CPython"
]

dynamic = ["version", "dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
version = {attr = "gns3server.version.__version__"}
dependencies = {file = "requirements.txt"}

[tool.setuptools.dynamic.optional-dependencies]
# Development dependencies
dev = {file = ['dev-requirements.txt']}

# AI features bundle — installs both AI Copilot and MCP dependencies
ai-features = {file = ['ai-requirements.txt', 'mcp-requirements.txt']}
# terraform = {file = ['terraform-requirements.txt']}  # Future component

[project.urls]
"Homepage" = "http://gns3.com"
"Repository" = "http://github.com/GNS3/gns3-server"
"Bug tracker" = "http://github.com/GNS3/gns3-server/issues"

[project.scripts]
gns3server = "gns3server.main:main"
gns3vmnet = "gns3server.utils.vmnet:main"
gns3server-web-wireshark-setup = "gns3server.agent.web_wireshark.setup_wireshark_image:main"
gns3server-uninstall-ai-features = "gns3server.utils.uninstall_ai_features:main"

[tool.setuptools]
packages = ["gns3server"]


[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "*.md",
]

[tool.ruff.lint]
select = [
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C90",   # mccabe
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "LOG",   # flake8-logging
  "PLE",   # pylint errors
  "PLW",   # pylint warnings
  "RUF",   # ruff-specific rules
  "S",     # flake8-bandit
  "T10",   # flake8-debugger
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
# Baseline: widespread rules that the existing code still violates
# (violation count at baseline time). Remove an entry, and fix its
# violations, in a dedicated small PR. Never add new entries here:
# fix the code or use a targeted "# noqa: CODE" with a reason.
ignore = [
  "ASYNC230",  #  240  blocking-open-call-in-async-function
  "ASYNC240",  #  235  blocking-path-method-in-async-function
  "B007",      #   32  unused-loop-control-variable
  "B008",      #  119  function-call-in-default-argument
  "B904",      #  365  raise-without-from-inside-except
  "BLE001",    #  214  blind-except
  "E402",      #  129  module-import-not-at-top-of-file
  "E501",      #  655  line-too-long
  "F401",      #  300  unused-import
  "F541",      #   16  f-string-missing-placeholders
  "F841",      #   32  unused-variable
  "I001",      #  441  unsorted-imports
  "PLW0603",   #   21  global-statement
  "PLW2901",   #   30  redefined-loop-name
  "RUF010",    #   65  explicit-f-string-type-conversion
  "RUF012",    #   23  mutable-class-default
  "RUF013",    #   40  implicit-optional
  "RUF036",    #   22  none-not-at-end-of-union
  "RUF059",    #   29  unused-unpacked-variable
  "S101",      #   19  assert
  "S104",      #   22  hardcoded-bind-all-interfaces
  "S110",      #   23  try-except-pass
  "UP006",     #  270  non-pep585-annotation
  "UP007",     #   81  non-pep604-annotation-union
  "UP009",     #   51  utf8-encoding-declaration
  "UP032",     #  560  f-string
  "UP035",     #  106  deprecated-import
  "UP045",     # 1100  non-pep604-annotation-optional
  "W293",      #  661  blank-line-with-whitespace
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as defaults:
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and hardcoded credentials / temp paths:
"tests/**" = ["S101", "S105", "S106", "S108"]
# Baseline: existing violations of rules that are enforced everywhere else.
