[pytest]
asyncio_default_fixture_loop_scope=function

; Live end-to-end tests (tests/e2e, see its README) need privileges, real
; images and emulator binaries — they never run in a normal test run. Run
; them explicitly with: pytest -m e2e tests/e2e
markers =
    e2e: live end-to-end tests (real server, kernel interfaces, emulators)
addopts = -m "not e2e"

filterwarnings =
    ignore:'asyncio\.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith\._internal\._beta_decorator
    ignore:_pytest\.python\.CallSpec2 has been renamed to CallSpec\.:pytest.PytestRemovedIn10Warning:anyio\.pytest_plugin